## 本文件是参数模板，会提交到版本库；真实值请写在 local.properties.user（已被 .gitignore 忽略）。
## 两处都可以填，local.properties.user 里的同名 key 会覆盖这里的值；留空则用 app/build.gradle.kts 里的默认值。

# Android SDK 路径，本机路径不适合提交，改由环境变量 ANDROID_HOME 提供，Android Studio 也会自动写入。
# sdk.dir=/Users/<your-user>/Library/Android/sdk

# ==== 应用标识 ====
# 各广告平台按包名审核，切测试包名改这里
atfo.applicationId=
atfo.appName=

# ==== 账户参数（向对接运营获取）====
atfo.appId=
atfo.secret=
atfo.mediaId=
# PRODUCTION | STAGING
atfo.env=
atfo.debug=

# ==== 代码位 Id（向对接运营获取）====
atfo.splashSlotId=
atfo.feedSlotId=
atfo.interstitialSlotId=
atfo.rewardSlotId=
atfo.notifySlotId=

name: Sync README SDK version

on:
  schedule:
    # 每天上午 9:20（UTC）检查一次 Maven 仓库是否有新 SDK 版本
    - cron: "20 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/sync_readme_version.py"
      - ".github/workflows/sync-readme-version.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步 README 版本号
        run: python scripts/sync_readme_version.py

      - name: 有变更则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 已是最新版本号，无需提交"
          else
            git commit -m "docs: README 同步 SDK 最新版本号"
            git push
          fi
